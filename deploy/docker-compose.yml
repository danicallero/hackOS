# ─────────────────────────────────────────────────────────────────────────
# hackOS — production stack (one deployable instance per hackathon/tenant).
#
# Designed for the GPULux `hackos` LXC and works with plain `docker compose`.
# Deploy ONE stack per instance; isolation comes from a unique Compose project
# name, which scopes volumes and the private network. See deploy/README.md.
#
# Every value is supplied by environment interpolation (${VAR}) from the
# secret/config file already present in the LXC. The deployment script passes
# IMAGE_TAG separately so only immutable sha-<commit> images are deployed.
#
# Networking model:
#   private  (internal: true) — postgres, valkey, minio + app tier. Datastores
#            have no host ports and cannot use the internet.
#   egress   (Compose bridge) — api and worker only, for mail/push providers.
#   api/web  publish only their HTTP ports to the LXC; GPULux's proxy reaches
#            those ports over the Incus network. Docker's Remote API is unused.
# ─────────────────────────────────────────────────────────────────────────

x-api-image: &api-image "${IMAGE_REPO:?IMAGE_REPO is required}:${IMAGE_TAG:?IMAGE_TAG is required}"

# App-tier env shared by api / worker / migrate. Anchored so the three stay
# in lockstep — change a secret once, all three pick it up.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  VALKEY_URL: "redis://:${VALKEY_PASSWORD}@valkey:6379"
  BETTER_AUTH_URL: "https://${API_DOMAIN}"
  WEB_URL: "https://${WEB_DOMAIN}"
  BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
  CORS_ORIGINS: "${CORS_ORIGINS:-}"
  MOBILE_APP_SCHEME: "${MOBILE_APP_SCHEME:-hackos}"
  TRUST_PROXY: "true"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  LOG_EXPO_PUSH_TICKETS: "${LOG_EXPO_PUSH_TICKETS:-false}"
  LOG_EXPO_PUSH_TOKENS: "${LOG_EXPO_PUSH_TOKENS:-false}"
  LOG_EXPO_PUSH_UNSAFE_DEBUG: "${LOG_EXPO_PUSH_UNSAFE_DEBUG:-false}"
  DB_POOL_MAX: "${DB_POOL_MAX:-20}"
  DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-30000}"
  DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-10000}"
  DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-30000}"
  DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}"
  SSE_MAX_CONNECTIONS_GLOBAL: "${SSE_MAX_CONNECTIONS_GLOBAL:-2000}"
  SSE_MAX_CONNECTIONS_PER_TOPIC: "${SSE_MAX_CONNECTIONS_PER_TOPIC:-500}"
  SSE_MAX_CONNECTIONS_PER_CLIENT: "${SSE_MAX_CONNECTIONS_PER_CLIENT:-20}"
  SSE_WRITE_TIMEOUT_MS: "${SSE_WRITE_TIMEOUT_MS:-5000}"
  RATE_LIMIT_SCAN_MAX: "${RATE_LIMIT_SCAN_MAX:-120}"
  RATE_LIMIT_SCAN_WINDOW_SECONDS: "${RATE_LIMIT_SCAN_WINDOW_SECONDS:-60}"
  RATE_LIMIT_MEAL_BATCH_MAX: "${RATE_LIMIT_MEAL_BATCH_MAX:-60}"
  RATE_LIMIT_MEAL_BATCH_WINDOW_SECONDS: "${RATE_LIMIT_MEAL_BATCH_WINDOW_SECONDS:-60}"
  RATE_LIMIT_SNAPSHOT_MAX: "${RATE_LIMIT_SNAPSHOT_MAX:-20}"
  RATE_LIMIT_SNAPSHOT_WINDOW_SECONDS: "${RATE_LIMIT_SNAPSHOT_WINDOW_SECONDS:-60}"
  NOTIFICATION_OUTBOX_BATCH_SIZE: "${NOTIFICATION_OUTBOX_BATCH_SIZE:-100}"
  S3_ENDPOINT: "http://minio:9000"
  S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
  S3_SECRET_KEY: "${S3_SECRET_KEY}"
  S3_BUCKET: "${S3_BUCKET:-hackos}"
  S3_PUBLIC_URL: "${S3_PUBLIC_URL:-}"
  MAIL_PROVIDER: "${MAIL_PROVIDER:-smtp}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-hackOS}"
  MAIL_FOOTER_TEXT: "${MAIL_FOOTER_TEXT:-hackOS — this is an automated message.}"
  MAIL_LAYOUT_BRAND_NAME: "${MAIL_LAYOUT_BRAND_NAME:-hackOS}"
  MAIL_LAYOUT_HEADER_TEXT: "${MAIL_LAYOUT_HEADER_TEXT:-hackOS}"
  MAIL_LAYOUT_HEADER_SUBTEXT: "${MAIL_LAYOUT_HEADER_SUBTEXT:-}"
  MAIL_LAYOUT_LOGO_URL: "${MAIL_LAYOUT_LOGO_URL-https://${WEB_DOMAIN}/email/brand-mark.png}"
  MAIL_LAYOUT_ACCENT_COLOR: "${MAIL_LAYOUT_ACCENT_COLOR:-#18181b}"
  MAIL_LAYOUT_BG_COLOR: "${MAIL_LAYOUT_BG_COLOR:-#f4f4f5}"
  MAIL_LAYOUT_CARD_COLOR: "${MAIL_LAYOUT_CARD_COLOR:-#ffffff}"
  MAIL_LAYOUT_CARD_BORDER_COLOR: "${MAIL_LAYOUT_CARD_BORDER_COLOR:-#e4e4e7}"
  MAIL_LAYOUT_TEXT_COLOR: "${MAIL_LAYOUT_TEXT_COLOR:-#18181b}"
  MAIL_LAYOUT_MUTED_TEXT_COLOR: "${MAIL_LAYOUT_MUTED_TEXT_COLOR:-#71717a}"
  MAIL_LAYOUT_FOOTER_BG_COLOR: "${MAIL_LAYOUT_FOOTER_BG_COLOR:-#fafafa}"
  MAIL_LAYOUT_CARD_RADIUS: "${MAIL_LAYOUT_CARD_RADIUS:-8}"
  MAIL_LAYOUT_MAX_WIDTH: "${MAIL_LAYOUT_MAX_WIDTH:-560}"
  RESEND_API_KEY: "${RESEND_API_KEY:-}"
  POSTAL_URL: "${POSTAL_URL:-}"
  POSTAL_API_KEY: "${POSTAL_API_KEY:-}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"
  # Wallet passes (H28) — both optional, see deploy/README.md#wallet-passes-h28.
  # worker needs these too: badge rotation pushes/syncs run there.
  APPLE_PASS_TYPE_IDENTIFIER: "${APPLE_PASS_TYPE_IDENTIFIER:-}"
  APPLE_TEAM_IDENTIFIER: "${APPLE_TEAM_IDENTIFIER:-}"
  APPLE_PASS_ORGANIZATION: "${APPLE_PASS_ORGANIZATION:-hackOS}"
  APPLE_PASS_CERTIFICATE_PEM: "${APPLE_PASS_CERTIFICATE_PEM:-}"
  APPLE_PASS_KEY_PEM: "${APPLE_PASS_KEY_PEM:-}"
  APPLE_PASS_KEY_PASSPHRASE: "${APPLE_PASS_KEY_PASSPHRASE:-}"
  APPLE_WWDR_CERTIFICATE_PEM: "${APPLE_WWDR_CERTIFICATE_PEM:-}"
  APPLE_APNS_ENVIRONMENT: "${APPLE_APNS_ENVIRONMENT:-production}"
  APPLE_PASS_APP_STORE_ID: "${APPLE_PASS_APP_STORE_ID:-}"
  GOOGLE_WALLET_ISSUER_ID: "${GOOGLE_WALLET_ISSUER_ID:-}"
  GOOGLE_WALLET_EVENT_TICKET_CLASS_ID: "${GOOGLE_WALLET_EVENT_TICKET_CLASS_ID:-}"
  GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL: "${GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL:-}"
  GOOGLE_WALLET_PRIVATE_KEY_PEM: "${GOOGLE_WALLET_PRIVATE_KEY_PEM:-}"
  GOOGLE_WALLET_LOGO_URL: "${GOOGLE_WALLET_LOGO_URL:-}"
  GOOGLE_WALLET_HERO_IMAGE_URL: "${GOOGLE_WALLET_HERO_IMAGE_URL:-}"
  GOOGLE_WALLET_WIDE_LOGO_URL: "${GOOGLE_WALLET_WIDE_LOGO_URL:-}"
  GOOGLE_WALLET_BACKGROUND_COLOR: "${GOOGLE_WALLET_BACKGROUND_COLOR:-#1f2430}"
  TRANSLATE_PROVIDER: "${TRANSLATE_PROVIDER:-google}"
  GOOGLE_TRANSLATE_API_KEY: "${GOOGLE_TRANSLATE_API_KEY:-}"
  LIBRETRANSLATE_URL: "${LIBRETRANSLATE_URL:-}"
  LIBRETRANSLATE_API_KEY: "${LIBRETRANSLATE_API_KEY:-}"

# Synthetic fixture secrets are API-only. Do not pass them to migrate or
# worker; the API uses them for the marked fixture workspace in this same
# deployment/database.
x-review-fixture-env: &review-fixture-env
  REVIEW_FIXTURE_PASSWORD: "${REVIEW_FIXTURE_PASSWORD:-}"
  REVIEW_FIXTURE_DELETION_PIN: "${REVIEW_FIXTURE_DELETION_PIN:-}"

x-api-env: &api-env
  <<: [*app-env, *review-fixture-env]

x-security: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  # ── datastores (private network only, never published) ─────────────────
  postgres:
    <<: *hardening
    image: "postgres:17-alpine"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      # Data checksums catch silent corruption; cheap insurance for event data.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: "${PG_MEM_LIMIT:-1g}"

  valkey:
    <<: *hardening
    image: "valkey/valkey:8-alpine"
    # requirepass so a stray container on the same net can't read the cache.
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}", "--save", "", "--appendonly", "no"]
    # Password in env too so the healthcheck (valkey-cli -a "$VALKEY_PASSWORD")
    # can authenticate from inside the container.
    environment:
      VALKEY_PASSWORD: "${VALKEY_PASSWORD}"
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $${VALKEY_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: "${VALKEY_MEM_LIMIT:-512m}"

  minio:
    <<: *hardening
    image: "${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      # keep the console off the public internet unless explicitly proxied
      MINIO_BROWSER: "${MINIO_BROWSER:-off}"
    volumes:
      - miniodata:/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: "${MINIO_MEM_LIMIT:-1g}"

  # ── one-shot: create the S3 bucket, then exit ──────────────────────────
  minio-init:
    image: "${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z}"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set s3 http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "s3/$${S3_BUCKET}" &&
        mc anonymous set none "s3/$${S3_BUCKET}" &&
        mc anonymous set download "s3/$${S3_BUCKET}/enterprises" &&
        echo "bucket $${S3_BUCKET} ready (enterprises/ public, uploads/ private)"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      S3_BUCKET: "${S3_BUCKET:-hackos}"
    networks: [private]
    restart: "no"

  # ── one-shot: apply DB migrations, then exit (advisory-locked) ──────────
  migrate:
    image: *api-image
    pull_policy: always
    command: ["node", "dist/migrate.js"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"

  # ── HTTP API (published to the GPULux proxy) ────────────────────────────
  api:
    <<: *hardening
    image: *api-image
    pull_policy: always
    # H10/H53: repeat the advisory-locked migration check here as a guard for
    # redeploys that reuse an already-completed one-shot `migrate` container.
    command: ["sh", "-c", "node dist/migrate.js && exec node dist/server.js"]
    environment: *api-env
    # Deterministic external DNS — do not inherit a host resolver that may be
    # transiently wrong during deploys; internal service names still use the
    # Docker resolver on the attached networks.
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "${API_PUBLISH_PORT:-3000}:3000"
    networks:
      private: {}
      egress: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: "${API_MEM_LIMIT:-512m}"

  # ── web frontend (Next.js, published to the GPULux proxy) ──────────────
  # Separate port and domain. It never touches the private datastores; the
  # browser reaches the API directly using the runtime config served here.
  web:
    <<: *hardening
    image: "${WEB_IMAGE_REPO:?WEB_IMAGE_REPO is required}:${IMAGE_TAG:?IMAGE_TAG is required}"
    pull_policy: always
    environment:
      API_DOMAIN: "${API_DOMAIN}"
      WEB_DOMAIN: "${WEB_DOMAIN}"
    ports:
      - "${WEB_PUBLISH_PORT:-3001}:3001"
    networks: [egress]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: "${WEB_MEM_LIMIT:-256m}"

  # ── BullMQ worker (no ingress; egress for mail/push) ───────────────────
  worker:
    <<: *hardening
    image: *api-image
    pull_policy: always
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
      WORKERS_INLINE: "false"
    # Keep outbound mail/push resolution independent of the host resolver,
    # matching the split-stack service definitions.
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [private, egress]
    # The image bakes an HTTP /healthz probe for the API; the worker serves no
    # HTTP, so disable it. Liveness is process-based: on crash, restart kicks in.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: "${WORKER_MEM_LIMIT:-512m}"

networks:
  # Private: datastores + app tier. internal:true => no host route or egress.
  private:
    driver: bridge
    internal: true
  # Egress: only app processes that call external providers join this network.
  egress:
    driver: bridge

volumes:
  pgdata:
  miniodata:
