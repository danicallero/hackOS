# hackOS — canonical multi-architecture Compose runtime.
#
# This file only consumes pre-built images.
# Production uses one environment file (mode 600):
#
#   docker compose --env-file /etc/hackos/hackos.env \
#     -f deploy/docker-compose.yml up -d
#
# Staging keeps the two existing files:
#
#   docker compose --env-file /etc/hackos/hackos.env \
#     --env-file /etc/hackos/hackos.secrets \
#     -f deploy/docker-compose.yml up -d
#
# The private and egress bridge networks are created by Compose. PostgreSQL
# and MinIO bind their state below HACKOS_DATA_DIR (the production LXC mounts
# its persistent volume at /mnt/data). The proxy reaches api, web and the S3
# API. The MinIO console is disabled.
# Set PUBLISH_BIND_ADDRESS=127.0.0.1 when the proxy runs on the same host; the
# proxy LXC normally needs 0.0.0.0.
#
# Event-day sizing (H22-H42, H46, H540, #544): postgres 5 GiB + valkey 2 GiB +
# minio 1 GiB + api 2 GiB + worker 2 GiB + web 1 GiB = 13 GiB of declared
# container RAM limits. Each service also has an explicit swap ceiling so a
# short-lived burst can use host swap without allowing one service to consume
# the entire host. Qualification mirrors the shared-service limits.

# API and web are released as separate immutable tags. The deploy script sets
# the service-specific variables so a partial release can retain the image for
# the service that did not change; direct Compose use still falls back to the
# legacy single IMAGE_TAG contract.
x-api-image: &api-image "ghcr.io/danicallero/hackos-api:${API_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}"
x-web-image: &web-image "ghcr.io/danicallero/hackos-web:${WEB_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}"

x-database-env: &database-env
  DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

x-valkey-env: &valkey-env
  VALKEY_URL: "redis://:${VALKEY_PASSWORD}@valkey:6379"
  SSE_NAMESPACE: "${SSE_NAMESPACE:-production}"

x-auth-env: &auth-env
  BETTER_AUTH_URL: "https://${API_DOMAIN}"
  WEB_URL: "https://${WEB_DOMAIN}"
  BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
  MOBILE_APP_SCHEME: "${MOBILE_APP_SCHEME:-hackos}"

x-storage-env: &storage-env
  S3_ENDPOINT: "http://minio:9000"
  S3_REGION: "${S3_REGION:-us-east-1}"
  S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
  S3_SECRET_KEY: "${S3_SECRET_KEY}"
  S3_BUCKET: "${S3_BUCKET:-hackos}"
  S3_PUBLIC_URL: "${S3_PUBLIC_URL:-}"

x-wallet-env: &wallet-env
  APPLE_PASS_TYPE_IDENTIFIER: "${APPLE_PASS_TYPE_IDENTIFIER:-}"
  APPLE_TEAM_IDENTIFIER: "${APPLE_TEAM_IDENTIFIER:-}"
  APPLE_PASS_ORGANIZATION: "${APPLE_PASS_ORGANIZATION:-hackOS}"
  APPLE_PASS_CERTIFICATE_PEM: "${APPLE_PASS_CERTIFICATE_PEM:-}"
  APPLE_PASS_KEY_PEM: "${APPLE_PASS_KEY_PEM:-}"
  APPLE_PASS_KEY_PASSPHRASE: "${APPLE_PASS_KEY_PASSPHRASE:-}"
  APPLE_WWDR_CERTIFICATE_PEM: "${APPLE_WWDR_CERTIFICATE_PEM:-}"
  APPLE_APNS_ENVIRONMENT: "${APPLE_APNS_ENVIRONMENT:-production}"
  APPLE_PASS_APP_STORE_ID: "${APPLE_PASS_APP_STORE_ID:-}"
  GOOGLE_WALLET_ISSUER_ID: "${GOOGLE_WALLET_ISSUER_ID:-}"
  GOOGLE_WALLET_EVENT_TICKET_CLASS_ID: "${GOOGLE_WALLET_EVENT_TICKET_CLASS_ID:-}"
  GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL: "${GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL:-}"
  GOOGLE_WALLET_PRIVATE_KEY_PEM: "${GOOGLE_WALLET_PRIVATE_KEY_PEM:-}"
  GOOGLE_WALLET_LOGO_URL: "${GOOGLE_WALLET_LOGO_URL:-}"
  GOOGLE_WALLET_HERO_IMAGE_URL: "${GOOGLE_WALLET_HERO_IMAGE_URL:-}"
  GOOGLE_WALLET_WIDE_LOGO_URL: "${GOOGLE_WALLET_WIDE_LOGO_URL:-}"
  GOOGLE_WALLET_BACKGROUND_COLOR: "${GOOGLE_WALLET_BACKGROUND_COLOR:-#a3d5ff}"
  WALLET_FOREGROUND_COLOR: "${WALLET_FOREGROUND_COLOR:-#fafafa}"
  WALLET_LABEL_COLOR: "${WALLET_LABEL_COLOR:-#030846}"
  WALLET_WEBSITE_URL: "${WALLET_WEBSITE_URL:-https://os.hackudc.com}"
  WALLET_SHOW_DIRECTIONS: "${WALLET_SHOW_DIRECTIONS:-true}"
  WALLET_SHOW_SCHEDULE: "${WALLET_SHOW_SCHEDULE:-true}"
  WALLET_SCHEDULE_URL: "${WALLET_SCHEDULE_URL:-}"
  WALLET_ANDROID_PACKAGE_NAME: "${WALLET_ANDROID_PACKAGE_NAME:-com.hackudc.os}"
  WALLET_ANDROID_STORE_URL: "${WALLET_ANDROID_STORE_URL:-https://play.google.com/store/apps/details?id=com.hackudc.os}"
  WALLET_APPLE_OPTIONS_JSON: "${WALLET_APPLE_OPTIONS_JSON:-{}}"
  WALLET_GOOGLE_CLASS_OPTIONS_JSON: "${WALLET_GOOGLE_CLASS_OPTIONS_JSON:-{}}"
  WALLET_GOOGLE_OBJECT_OPTIONS_JSON: "${WALLET_GOOGLE_OBJECT_OPTIONS_JSON:-{}}"

x-mail-env: &mail-env
  MAIL_PROVIDER: "${MAIL_PROVIDER:-smtp}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-hackOS}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_TLS_SERVERNAME: "${SMTP_TLS_SERVERNAME:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"
  SMTP_SECURE: "${SMTP_SECURE:-false}"
  SMTP_REQUIRE_TLS: "${SMTP_REQUIRE_TLS:-true}"

x-api-env: &api-env
  <<: [*database-env, *valkey-env, *auth-env, *storage-env, *wallet-env]
  NODE_ENV: production
  WORKERS_INLINE: "false"
  CORS_ORIGINS: "${CORS_ORIGINS}"
  TRUST_PROXY: "true"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  LOG_EXPO_PUSH_TICKETS: "${LOG_EXPO_PUSH_TICKETS:-false}"
  LOG_EXPO_PUSH_TOKENS: "${LOG_EXPO_PUSH_TOKENS:-false}"
  LOG_EXPO_PUSH_UNSAFE_DEBUG: "${LOG_EXPO_PUSH_UNSAFE_DEBUG:-false}"
  DB_POOL_MAX: "${DB_POOL_MAX:-24}"
  DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-30000}"
  DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-10000}"
  DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-30000}"
  DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}"
  SSE_MAX_CONNECTIONS_GLOBAL: "${SSE_MAX_CONNECTIONS_GLOBAL:-2000}"
  SSE_MAX_CONNECTIONS_PER_TOPIC: "${SSE_MAX_CONNECTIONS_PER_TOPIC:-500}"
  SSE_MAX_CONNECTIONS_PER_CLIENT: "${SSE_MAX_CONNECTIONS_PER_CLIENT:-20}"
  SSE_WRITE_TIMEOUT_MS: "${SSE_WRITE_TIMEOUT_MS:-5000}"
  RATE_LIMIT_SCAN_MAX: "${RATE_LIMIT_SCAN_MAX:-120}"
  RATE_LIMIT_SCAN_WINDOW_SECONDS: "${RATE_LIMIT_SCAN_WINDOW_SECONDS:-60}"
  RATE_LIMIT_MEAL_BATCH_MAX: "${RATE_LIMIT_MEAL_BATCH_MAX:-60}"
  RATE_LIMIT_MEAL_BATCH_WINDOW_SECONDS: "${RATE_LIMIT_MEAL_BATCH_WINDOW_SECONDS:-60}"
  RATE_LIMIT_SNAPSHOT_MAX: "${RATE_LIMIT_SNAPSHOT_MAX:-20}"
  RATE_LIMIT_SNAPSHOT_WINDOW_SECONDS: "${RATE_LIMIT_SNAPSHOT_WINDOW_SECONDS:-60}"
  TRANSLATE_PROVIDER: "${TRANSLATE_PROVIDER:-google}"
  GOOGLE_TRANSLATE_API_KEY: "${GOOGLE_TRANSLATE_API_KEY:-}"
  LIBRETRANSLATE_URL: "${LIBRETRANSLATE_URL:-}"
  LIBRETRANSLATE_API_KEY: "${LIBRETRANSLATE_API_KEY:-}"
  REVIEW_FIXTURE_PASSWORD: "${REVIEW_FIXTURE_PASSWORD:-}"
  REVIEW_FIXTURE_DELETION_PIN: "${REVIEW_FIXTURE_DELETION_PIN:-}"

x-worker-env: &worker-env
  <<: [*database-env, *valkey-env, *auth-env, *storage-env, *wallet-env, *mail-env]
  NODE_ENV: production
  WORKERS_INLINE: "false"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  LOG_EXPO_PUSH_TICKETS: "${LOG_EXPO_PUSH_TICKETS:-false}"
  LOG_EXPO_PUSH_UNSAFE_DEBUG: "${LOG_EXPO_PUSH_UNSAFE_DEBUG:-false}"
  DB_POOL_MAX: "${DB_POOL_MAX:-24}"
  DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-30000}"
  DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-10000}"
  DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-30000}"
  DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}"
  NOTIFICATION_OUTBOX_BATCH_SIZE: "${NOTIFICATION_OUTBOX_BATCH_SIZE:-100}"
  METRICS_PORT: "9464"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  # Ship the static, non-root reader with the API release (#544).
  metrics-init:
    image: *api-image
    user: "1000:1000"
    restart: "no"
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp /usr/local/bin/memory-launch /opt/hackos-metrics/memory-launch.new && chmod 0555 /opt/hackos-metrics/memory-launch.new && mv /opt/hackos-metrics/memory-launch.new /opt/hackos-metrics/memory-launch"]
    volumes:
      - metrics-tools-v2:/opt/hackos-metrics

  postgres:
    <<: *hardening
    entrypoint: ["/opt/hackos-metrics/memory-launch", "/run/hackos-memory/memory.json", "/usr/local/bin/docker-entrypoint.sh"]
    depends_on:
      metrics-init:
        condition: service_completed_successfully
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
    volumes:
      - type: bind
        source: "${HACKOS_DATA_DIR:-/mnt/data}/postgres"
        target: /var/lib/postgresql/data
      - metrics-tools-v2:/opt/hackos-metrics:ro
      - postgres-memory:/run/hackos-memory
    networks:
      private: {}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 5g
    memswap_limit: 6g
    mem_swappiness: 10
    shm_size: 1g

  valkey:
    <<: *hardening
    entrypoint: ["/opt/hackos-metrics/memory-launch", "/run/hackos-memory/memory.json", "/usr/local/bin/docker-entrypoint.sh"]
    depends_on:
      metrics-init:
        condition: service_completed_successfully
    image: valkey/valkey@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    command:
      - valkey-server
      - --requirepass
      - "${VALKEY_PASSWORD}"
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 1536mb
      - --maxmemory-policy
      - volatile-lru
      - --lazyfree-lazy-eviction
      - "yes"
      - --lazyfree-lazy-expire
      - "yes"
      - --tcp-keepalive
      - "60"
    environment:
      VALKEY_PASSWORD: "${VALKEY_PASSWORD}"
    volumes:
      - metrics-tools-v2:/opt/hackos-metrics:ro
      - valkey-memory:/run/hackos-memory
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${VALKEY_PASSWORD} valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g
    memswap_limit: 3g
    mem_swappiness: 40

  minio:
    <<: *hardening
    entrypoint: ["/opt/hackos-metrics/memory-launch", "/run/hackos-memory/memory.json", "/usr/bin/docker-entrypoint.sh"]
    depends_on:
      metrics-init:
        condition: service_completed_successfully
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_BROWSER: "off"
    volumes:
      - type: bind
        source: "${HACKOS_DATA_DIR:-/mnt/data}/minio"
        target: /data
      - metrics-tools-v2:/opt/hackos-metrics:ro
      - minio-memory:/run/hackos-memory
    networks:
      private: {}
      # A host-level tunnel may route S3_PUBLIC_URL to minio:9000 through the
      # same reviewed ingress network used by api and web. The console remains
      # disabled and is never routed.
      edge: {}
    # Public S3 API only. MinIO's anonymous policy permits downloads exclusively
    # below enterprises/; the console remains disabled and has no listener.
    ports:
      - "${PUBLISH_BIND_ADDRESS:-0.0.0.0}:${S3_PUBLISH_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
    memswap_limit: 2g
    mem_swappiness: 40

  # Idempotent storage bootstrap. It is deliberately separate from migrate:
  # the API and worker receive S3 credentials, while this helper also receives
  # the MinIO administration credentials needed to create the bucket and user.
  minio-init:
    # `mc` ships in the MinIO server image (and is already used by minio's
    # healthcheck). Reuse that verified local image rather than pulling the
    # separate Quay `mc` image, whose registry access may be unavailable while
    # the object store itself is healthy.
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    security_opt:
      - no-new-privileges:true
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set s3 http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "s3/$${S3_BUCKET}"
        printf '%s\n' \
          '{' \
          '  "Version": "2012-10-17",' \
          '  "Statement": [' \
          '    {"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::'"$${S3_BUCKET}"'"]},' \
          '    {"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:DeleteObject","s3:GetObject","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::'"$${S3_BUCKET}"'/*"]}' \
          '  ]' \
          '}' > /tmp/hackos-s3-policy.json
        mc admin policy create s3 hackos-app /tmp/hackos-s3-policy.json || true
        mc admin user add s3 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" ||
          mc admin user info s3 "$${S3_ACCESS_KEY}" >/dev/null
        mc admin policy attach s3 hackos-app --user "$${S3_ACCESS_KEY}"
        mc anonymous set none "s3/$${S3_BUCKET}"
        mc anonymous set download "s3/$${S3_BUCKET}/enterprises"
        echo "bucket $${S3_BUCKET} and application user ready"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_BUCKET: "${S3_BUCKET:-hackos}"
    networks: [private]

  # Explicit one-shot migration process. It needs only the database URL and
  # auth secret used by the migration's H54 compatibility checks.
  migrate:
    image: *api-image
    pull_policy: always
    command: ["node", "dist/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"

  api:
    <<: *hardening
    image: *api-image
    pull_policy: always
    # Keep a no-op-safe migration guard for direct/reused container starts.
    command: ["sh", "-c", "node dist/migrate.js && exec node dist/server.js"]
    environment: *api-env
    volumes:
      - postgres-memory:/run/hackos-memory/postgres:ro
      - valkey-memory:/run/hackos-memory/valkey:ro
      - minio-memory:/run/hackos-memory/minio:ro
      - web-memory:/run/hackos-memory/web:ro
    dns: ["1.1.1.1", "8.8.8.8"]
    ports:
      - "${PUBLISH_BIND_ADDRESS:-0.0.0.0}:${API_PUBLISH_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      private: {}
      egress: {}
      # Optional host-level tunnel/proxy network. Staging can point
      # EDGE_NETWORK_NAME at an existing ingress network when a tunnel
      # resolves the stable `api`, `web`, and (if needed) `minio` names.
      edge: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
    memswap_limit: 3g
    mem_swappiness: 20

  worker:
    <<: *hardening
    image: *api-image
    pull_policy: always
    command: ["node", "dist/worker.js"]
    environment: *worker-env
    ports:
      - "${PUBLISH_BIND_ADDRESS:-0.0.0.0}:${WORKER_METRICS_PUBLISH_PORT:-9464}:9464"
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      private: {}
      egress: {}
    healthcheck:
      test: ["CMD-SHELL", "pidof node >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
    memswap_limit: 3g
    mem_swappiness: 20

  web:
    <<: *hardening
    entrypoint: ["/opt/hackos-metrics/memory-launch", "/run/hackos-memory/memory.json", "/sbin/tini", "--", "/usr/local/bin/start-server.sh"]
    depends_on:
      metrics-init:
        condition: service_completed_successfully
    volumes:
      - metrics-tools-v2:/opt/hackos-metrics:ro
      - web-memory:/run/hackos-memory
    image: *web-image
    pull_policy: always
    environment:
      API_DOMAIN: "${API_DOMAIN}"
      WEB_DOMAIN: "${WEB_DOMAIN}"
    ports:
      - "${PUBLISH_BIND_ADDRESS:-0.0.0.0}:${WEB_PUBLISH_PORT:-3001}:3001"
    networks:
      egress: {}
      # See api.edge above. This is disabled as an external network by
      # default, so the normal production profile remains isolated.
      edge: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
    memswap_limit: 2g
    mem_swappiness: 40

volumes:
  # Executable storage survives metrics-init exiting. Version the volume so
  # existing noexec/1 MiB volumes need no destructive migration (#544).
  metrics-tools-v2:
  postgres-memory:
    driver_opts: &metrics-volume
      type: tmpfs
      device: tmpfs
      o: "size=1m,mode=1777,nosuid,nodev,noexec"
  valkey-memory:
    driver_opts: *metrics-volume
  minio-memory:
    driver_opts: *metrics-volume
  web-memory:
    driver_opts: *metrics-volume

networks:
  private:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  edge:
    name: "${EDGE_NETWORK_NAME:-hackos-edge}"
    external: ${EDGE_NETWORK_EXTERNAL:-false}
