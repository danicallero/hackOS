# hackOS — canonical `hackos` LXC runtime.
#
# This file only consumes pre-built images. Run it with the LXC configuration
# file first and the separate, chmod 600 secrets file second:
#
#   docker compose --env-file /etc/hackos/hackos.env \
#     --env-file /etc/hackos/hackos.secrets \
#     -f deploy/docker-compose.yml up -d
#
# The bridge networks are created by Compose. PostgreSQL and MinIO bind their
# state below HACKOS_DATA_DIR (the GPULux LXC mounts its persistent Incus
# volume at /mnt/data). The external proxy reaches only the HTTP ports
# published by api and web; the datastores have no published ports at all.
# Set PUBLISH_BIND_ADDRESS=127.0.0.1 when the proxy runs on the same host; the
# proxy LXC normally needs 0.0.0.0.
#
# Event-day sizing (H22-H42, H46, H540, #544): postgres 2 GiB + valkey 1 GiB +
# minio 1 GiB + api 1 GiB + worker 1 GiB + web 512 MiB = 6.5 GiB of declared
# container limits. This is sized for the production host budget with margin
# for the OS and Docker overhead. Qualification mirrors the four shared
# services and adds only its disposable 1 GiB runner and 512 MiB migrate
# helper, keeping that stack at the same 6.5 GiB declared budget.

x-api-image: &api-image "ghcr.io/danicallero/hackos-api:${IMAGE_TAG:?IMAGE_TAG is required}"
x-web-image: &web-image "ghcr.io/danicallero/hackos-web:${IMAGE_TAG:?IMAGE_TAG is required}"

x-database-env: &database-env
  DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

x-valkey-env: &valkey-env
  VALKEY_URL: "redis://:${VALKEY_PASSWORD}@valkey:6379"

x-auth-env: &auth-env
  BETTER_AUTH_URL: "https://${API_DOMAIN}"
  WEB_URL: "https://${WEB_DOMAIN}"
  BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
  MOBILE_APP_SCHEME: "${MOBILE_APP_SCHEME:-hackos}"

x-storage-env: &storage-env
  S3_ENDPOINT: "http://minio:9000"
  S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
  S3_SECRET_KEY: "${S3_SECRET_KEY}"
  S3_BUCKET: "${S3_BUCKET:-hackos}"
  S3_PUBLIC_URL: "${S3_PUBLIC_URL:-}"

x-wallet-env: &wallet-env
  APPLE_PASS_TYPE_IDENTIFIER: "${APPLE_PASS_TYPE_IDENTIFIER:-}"
  APPLE_TEAM_IDENTIFIER: "${APPLE_TEAM_IDENTIFIER:-}"
  APPLE_PASS_ORGANIZATION: "${APPLE_PASS_ORGANIZATION:-hackOS}"
  APPLE_PASS_CERTIFICATE_PEM: "${APPLE_PASS_CERTIFICATE_PEM:-}"
  APPLE_PASS_KEY_PEM: "${APPLE_PASS_KEY_PEM:-}"
  APPLE_PASS_KEY_PASSPHRASE: "${APPLE_PASS_KEY_PASSPHRASE:-}"
  APPLE_WWDR_CERTIFICATE_PEM: "${APPLE_WWDR_CERTIFICATE_PEM:-}"
  APPLE_APNS_ENVIRONMENT: "${APPLE_APNS_ENVIRONMENT:-production}"
  APPLE_PASS_APP_STORE_ID: "${APPLE_PASS_APP_STORE_ID:-}"
  GOOGLE_WALLET_ISSUER_ID: "${GOOGLE_WALLET_ISSUER_ID:-}"
  GOOGLE_WALLET_EVENT_TICKET_CLASS_ID: "${GOOGLE_WALLET_EVENT_TICKET_CLASS_ID:-}"
  GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL: "${GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL:-}"
  GOOGLE_WALLET_PRIVATE_KEY_PEM: "${GOOGLE_WALLET_PRIVATE_KEY_PEM:-}"
  GOOGLE_WALLET_LOGO_URL: "${GOOGLE_WALLET_LOGO_URL:-}"
  GOOGLE_WALLET_HERO_IMAGE_URL: "${GOOGLE_WALLET_HERO_IMAGE_URL:-}"
  GOOGLE_WALLET_WIDE_LOGO_URL: "${GOOGLE_WALLET_WIDE_LOGO_URL:-}"
  GOOGLE_WALLET_BACKGROUND_COLOR: "${GOOGLE_WALLET_BACKGROUND_COLOR:-#1f2430}"

x-mail-env: &mail-env
  MAIL_PROVIDER: "${MAIL_PROVIDER:-smtp}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-hackOS}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"

x-api-env: &api-env
  <<: [*database-env, *valkey-env, *auth-env, *storage-env, *wallet-env]
  NODE_ENV: production
  WORKERS_INLINE: "false"
  CORS_ORIGINS: "${CORS_ORIGINS}"
  TRUST_PROXY: "true"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  LOG_EXPO_PUSH_TICKETS: "${LOG_EXPO_PUSH_TICKETS:-false}"
  LOG_EXPO_PUSH_TOKENS: "${LOG_EXPO_PUSH_TOKENS:-false}"
  LOG_EXPO_PUSH_UNSAFE_DEBUG: "${LOG_EXPO_PUSH_UNSAFE_DEBUG:-false}"
  DB_POOL_MAX: "${DB_POOL_MAX:-24}"
  DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-30000}"
  DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-10000}"
  DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-30000}"
  DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}"
  SSE_MAX_CONNECTIONS_GLOBAL: "${SSE_MAX_CONNECTIONS_GLOBAL:-2000}"
  SSE_MAX_CONNECTIONS_PER_TOPIC: "${SSE_MAX_CONNECTIONS_PER_TOPIC:-500}"
  SSE_MAX_CONNECTIONS_PER_CLIENT: "${SSE_MAX_CONNECTIONS_PER_CLIENT:-20}"
  SSE_WRITE_TIMEOUT_MS: "${SSE_WRITE_TIMEOUT_MS:-5000}"
  RATE_LIMIT_SCAN_MAX: "${RATE_LIMIT_SCAN_MAX:-120}"
  RATE_LIMIT_SCAN_WINDOW_SECONDS: "${RATE_LIMIT_SCAN_WINDOW_SECONDS:-60}"
  RATE_LIMIT_MEAL_BATCH_MAX: "${RATE_LIMIT_MEAL_BATCH_MAX:-60}"
  RATE_LIMIT_MEAL_BATCH_WINDOW_SECONDS: "${RATE_LIMIT_MEAL_BATCH_WINDOW_SECONDS:-60}"
  RATE_LIMIT_SNAPSHOT_MAX: "${RATE_LIMIT_SNAPSHOT_MAX:-20}"
  RATE_LIMIT_SNAPSHOT_WINDOW_SECONDS: "${RATE_LIMIT_SNAPSHOT_WINDOW_SECONDS:-60}"
  TRANSLATE_PROVIDER: "${TRANSLATE_PROVIDER:-google}"
  GOOGLE_TRANSLATE_API_KEY: "${GOOGLE_TRANSLATE_API_KEY:-}"
  LIBRETRANSLATE_URL: "${LIBRETRANSLATE_URL:-}"
  LIBRETRANSLATE_API_KEY: "${LIBRETRANSLATE_API_KEY:-}"
  REVIEW_FIXTURE_PASSWORD: "${REVIEW_FIXTURE_PASSWORD:-}"
  REVIEW_FIXTURE_DELETION_PIN: "${REVIEW_FIXTURE_DELETION_PIN:-}"

x-worker-env: &worker-env
  <<: [*database-env, *valkey-env, *auth-env, *storage-env, *wallet-env, *mail-env]
  NODE_ENV: production
  WORKERS_INLINE: "false"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  LOG_EXPO_PUSH_TICKETS: "${LOG_EXPO_PUSH_TICKETS:-false}"
  LOG_EXPO_PUSH_UNSAFE_DEBUG: "${LOG_EXPO_PUSH_UNSAFE_DEBUG:-false}"
  DB_POOL_MAX: "${DB_POOL_MAX:-24}"
  DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-30000}"
  DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-10000}"
  DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-30000}"
  DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}"
  NOTIFICATION_OUTBOX_BATCH_SIZE: "${NOTIFICATION_OUTBOX_BATCH_SIZE:-100}"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    <<: *hardening
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - type: bind
        source: "${HACKOS_DATA_DIR:-/mnt/data}/postgres"
        target: /var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

  valkey:
    <<: *hardening
    image: valkey/valkey@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    command:
      - valkey-server
      - --requirepass
      - "${VALKEY_PASSWORD}"
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      VALKEY_PASSWORD: "${VALKEY_PASSWORD}"
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${VALKEY_PASSWORD} valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  minio:
    <<: *hardening
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_BROWSER: "off"
    volumes:
      - type: bind
        source: "${HACKOS_DATA_DIR:-/mnt/data}/minio"
        target: /data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # Idempotent storage bootstrap. It is deliberately separate from migrate:
  # the API and worker receive S3 credentials, while this helper also receives
  # the MinIO administration credentials needed to create the bucket and user.
  minio-init:
    image: quay.io/minio/mc@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    security_opt:
      - no-new-privileges:true
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set s3 http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "s3/$${S3_BUCKET}"
        printf '%s\n' \
          '{' \
          '  "Version": "2012-10-17",' \
          '  "Statement": [' \
          '    {"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::'"$${S3_BUCKET}"'"]},' \
          '    {"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:DeleteObject","s3:GetObject","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::'"$${S3_BUCKET}"'/*"]}' \
          '  ]' \
          '}' > /tmp/hackos-s3-policy.json
        mc admin policy create s3 hackos-app /tmp/hackos-s3-policy.json || true
        mc admin user add s3 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" ||
          mc admin user info s3 "$${S3_ACCESS_KEY}" >/dev/null
        mc admin policy attach s3 hackos-app --user "$${S3_ACCESS_KEY}"
        mc anonymous set none "s3/$${S3_BUCKET}"
        mc anonymous set download "s3/$${S3_BUCKET}/enterprises"
        echo "bucket $${S3_BUCKET} and application user ready"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_BUCKET: "${S3_BUCKET:-hackos}"
    networks: [private]

  # Explicit one-shot migration process. It needs only the database URL and
  # auth secret used by the migration's H54 compatibility checks.
  migrate:
    image: *api-image
    pull_policy: always
    command: ["node", "dist/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"

  api:
    <<: *hardening
    image: *api-image
    pull_policy: always
    # Keep a no-op-safe migration guard for direct/reused container starts.
    command: ["sh", "-c", "node dist/migrate.js && exec node dist/server.js"]
    environment: *api-env
    dns: ["1.1.1.1", "8.8.8.8"]
    ports:
      - "${PUBLISH_BIND_ADDRESS:-0.0.0.0}:${API_PUBLISH_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      private: {}
      egress: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    <<: *hardening
    image: *api-image
    pull_policy: always
    command: ["node", "dist/worker.js"]
    environment: *worker-env
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      private: {}
      egress: {}
    healthcheck:
      test: ["CMD-SHELL", "pidof node >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  web:
    <<: *hardening
    image: *web-image
    pull_policy: always
    environment:
      API_DOMAIN: "${API_DOMAIN}"
      WEB_DOMAIN: "${WEB_DOMAIN}"
    ports:
      - "${PUBLISH_BIND_ADDRESS:-0.0.0.0}:${WEB_PUBLISH_PORT:-3001}:3001"
    networks: [egress]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  private:
    driver: bridge
    internal: true
  egress:
    driver: bridge
