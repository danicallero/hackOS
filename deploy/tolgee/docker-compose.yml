# hackOS · Tolgee — self-hosted translation portal for packages/shared/locales.
#
# NOT a per-instance service (contrast deploy/services/*, one full stack per
# hackathon event). Tolgee is org-wide infra: deploy this stack ONCE, ever,
# independent of any event's lifecycle. See deploy/README.md.
#
# Exposure matches this deployment's actual setup: a Cloudflare Tunnel
# (a separate "cloudflared" Dokploy project) publishes application routes
# straight to internal `http://<service>:<port>` addresses — no Traefik, no
# cert-resolver labels here, Cloudflare terminates TLS at their edge. Because
# Tolgee must stay reachable independent of any single hackathon instance
# (unlike api/web/minio, which the tunnel already reaches on THAT instance's
# private network), this stack creates its OWN dedicated network instead of
# joining an instance network. One-time manual steps after first deploy:
#   1. docker network connect hackos-tolgee-net <cloudflared-container>
#   2. In the Cloudflare Zero Trust dashboard, add a Published application
#      route for your chosen translate subdomain -> http://tolgee:8080
#
# Tolgee needs its own Postgres (v4+ removed the bundled/autostart database
# from the image) — this is NOT the per-instance `postgres` service, it has
# no per-instance lifecycle to tie it to.

services:
  tolgee:
    image: "${TOLGEE_IMAGE:-tolgee/tolgee:latest}"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tolgee}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      TOLGEE_POSTGRES_AUTOSTART_ENABLED: "false"
      TOLGEE_AUTHENTICATION_ENABLED: "true"
      TOLGEE_AUTHENTICATION_JWT_SECRET: "${TOLGEE_JWT_SECRET}"
      TOLGEE_AUTHENTICATION_INITIAL_USERNAME: "${TOLGEE_INITIAL_USERNAME:-admin}"
      TOLGEE_AUTHENTICATION_INITIAL_PASSWORD: "${TOLGEE_INITIAL_PASSWORD}"
      TOLGEE_FRONT_END_URL: "https://${TOLGEE_DOMAIN}"
      TOLGEE_BACK_END_URL: "https://${TOLGEE_DOMAIN}"
    volumes:
      - tolgeedata:/data
    networks:
      tolgee:
        aliases: ["tolgee"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: "${TOLGEE_MEM_LIMIT:-1g}"

  postgres:
    image: "postgres:17-alpine"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-tolgee}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      tolgee:
        aliases: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-tolgee}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: "${PG_MEM_LIMIT:-512m}"

networks:
  # Not external: this compose file is the sole owner of this network.
  # Named explicitly (not templated) since there is only ever one Tolgee
  # deployment — contrast the per-instance ${INSTANCE_NETWORK} pattern.
  tolgee:
    name: hackos-tolgee-net

volumes:
  tolgeedata:
  pgdata:
