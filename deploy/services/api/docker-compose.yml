# hackOS · api — one standalone Dokploy service (HTTP API + its migrations).
# Joins the per-instance private network (to reach postgres/valkey/minio) AND
# the proxy network (Traefik ingress). This is the ONLY hackOS service exposed
# to the internet. A one-shot `migrate` runs first, guarded by an advisory lock
# so redeploys/replicas are safe.
#
# Image: set IMAGE_REPO/IMAGE_TAG to a prebuilt image, or let Dokploy build
# from source (build context is the repo root).

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  VALKEY_URL: "redis://:${VALKEY_PASSWORD}@valkey:6379"
  BETTER_AUTH_URL: "https://${API_DOMAIN}"
  WEB_URL: "https://${WEB_DOMAIN}"
  BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
  CORS_ORIGINS: "${CORS_ORIGINS:-}"
  MOBILE_APP_SCHEME: "${MOBILE_APP_SCHEME:-hackos}"
  TRUST_PROXY: "true"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  # Postgres pool sizing/timeouts (H540) — see docs/env-vars.md.
  DB_POOL_MAX: "${DB_POOL_MAX:-20}"
  DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-30000}"
  DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-10000}"
  DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-30000}"
  DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}"
  # SSE connection budgets/backpressure (H540, api only) — see docs/env-vars.md.
  SSE_MAX_CONNECTIONS_GLOBAL: "${SSE_MAX_CONNECTIONS_GLOBAL:-2000}"
  SSE_MAX_CONNECTIONS_PER_TOPIC: "${SSE_MAX_CONNECTIONS_PER_TOPIC:-500}"
  SSE_MAX_CONNECTIONS_PER_CLIENT: "${SSE_MAX_CONNECTIONS_PER_CLIENT:-20}"
  SSE_WRITE_TIMEOUT_MS: "${SSE_WRITE_TIMEOUT_MS:-5000}"
  # Operational scanner rate limits (#538, per staff user) — see docs/rate-limiting.md.
  RATE_LIMIT_SCAN_MAX: "${RATE_LIMIT_SCAN_MAX:-120}"
  RATE_LIMIT_SCAN_WINDOW_SECONDS: "${RATE_LIMIT_SCAN_WINDOW_SECONDS:-60}"
  RATE_LIMIT_MEAL_BATCH_MAX: "${RATE_LIMIT_MEAL_BATCH_MAX:-60}"
  RATE_LIMIT_MEAL_BATCH_WINDOW_SECONDS: "${RATE_LIMIT_MEAL_BATCH_WINDOW_SECONDS:-60}"
  RATE_LIMIT_SNAPSHOT_MAX: "${RATE_LIMIT_SNAPSHOT_MAX:-20}"
  RATE_LIMIT_SNAPSHOT_WINDOW_SECONDS: "${RATE_LIMIT_SNAPSHOT_WINDOW_SECONDS:-60}"
  S3_ENDPOINT: "http://minio:9000"
  S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
  S3_SECRET_KEY: "${S3_SECRET_KEY}"
  S3_BUCKET: "${S3_BUCKET:-hackos}"
  # Public https base sponsor LOGOS are served from (the enterprises/ prefix is
  # the only public part of the bucket, incl. bucket in the path). Application
  # uploads are private and proxied by the API, so they don't need this. Without
  # it, logo URLs fall back to the internal http://minio:9000 host the browser
  # can't reach. e.g. https://s3-hackos.example.com/hackos
  S3_PUBLIC_URL: "${S3_PUBLIC_URL:-}"
  MAIL_PROVIDER: "${MAIL_PROVIDER:-smtp}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-hackOS}"
  MAIL_FOOTER_TEXT: "${MAIL_FOOTER_TEXT:-hackOS — this is an automated message.}"
  MAIL_LAYOUT_BRAND_NAME: "${MAIL_LAYOUT_BRAND_NAME:-hackOS}"
  MAIL_LAYOUT_HEADER_TEXT: "${MAIL_LAYOUT_HEADER_TEXT:-hackOS}"
  MAIL_LAYOUT_HEADER_SUBTEXT: "${MAIL_LAYOUT_HEADER_SUBTEXT:-}"
  MAIL_LAYOUT_LOGO_URL: "${MAIL_LAYOUT_LOGO_URL-https://${WEB_DOMAIN}/email/brand-mark.png}"
  MAIL_LAYOUT_ACCENT_COLOR: "${MAIL_LAYOUT_ACCENT_COLOR:-#18181b}"
  MAIL_LAYOUT_BG_COLOR: "${MAIL_LAYOUT_BG_COLOR:-#f4f4f5}"
  MAIL_LAYOUT_CARD_COLOR: "${MAIL_LAYOUT_CARD_COLOR:-#ffffff}"
  MAIL_LAYOUT_CARD_BORDER_COLOR: "${MAIL_LAYOUT_CARD_BORDER_COLOR:-#e4e4e7}"
  MAIL_LAYOUT_TEXT_COLOR: "${MAIL_LAYOUT_TEXT_COLOR:-#18181b}"
  MAIL_LAYOUT_MUTED_TEXT_COLOR: "${MAIL_LAYOUT_MUTED_TEXT_COLOR:-#71717a}"
  MAIL_LAYOUT_FOOTER_BG_COLOR: "${MAIL_LAYOUT_FOOTER_BG_COLOR:-#fafafa}"
  MAIL_LAYOUT_CARD_RADIUS: "${MAIL_LAYOUT_CARD_RADIUS:-8}"
  MAIL_LAYOUT_MAX_WIDTH: "${MAIL_LAYOUT_MAX_WIDTH:-560}"
  RESEND_API_KEY: "${RESEND_API_KEY:-}"
  POSTAL_URL: "${POSTAL_URL:-}"
  POSTAL_API_KEY: "${POSTAL_API_KEY:-}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"
  # Wallet passes (H28) — both optional, see deploy/README.md#wallet-passes-h28.
  APPLE_PASS_TYPE_IDENTIFIER: "${APPLE_PASS_TYPE_IDENTIFIER:-}"
  APPLE_TEAM_IDENTIFIER: "${APPLE_TEAM_IDENTIFIER:-}"
  APPLE_PASS_ORGANIZATION: "${APPLE_PASS_ORGANIZATION:-hackOS}"
  APPLE_PASS_CERTIFICATE_PEM: "${APPLE_PASS_CERTIFICATE_PEM:-}"
  APPLE_PASS_KEY_PEM: "${APPLE_PASS_KEY_PEM:-}"
  APPLE_PASS_KEY_PASSPHRASE: "${APPLE_PASS_KEY_PASSPHRASE:-}"
  APPLE_WWDR_CERTIFICATE_PEM: "${APPLE_WWDR_CERTIFICATE_PEM:-}"
  APPLE_APNS_ENVIRONMENT: "${APPLE_APNS_ENVIRONMENT:-production}"
  APPLE_PASS_APP_STORE_ID: "${APPLE_PASS_APP_STORE_ID:-}"
  GOOGLE_WALLET_ISSUER_ID: "${GOOGLE_WALLET_ISSUER_ID:-}"
  GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL: "${GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL:-}"
  GOOGLE_WALLET_PRIVATE_KEY_PEM: "${GOOGLE_WALLET_PRIVATE_KEY_PEM:-}"
  # Automatic translation (H50) — see docs/env-vars.md.
  TRANSLATE_PROVIDER: "${TRANSLATE_PROVIDER:-google}"
  GOOGLE_TRANSLATE_API_KEY: "${GOOGLE_TRANSLATE_API_KEY:-}"
  LIBRETRANSLATE_URL: "${LIBRETRANSLATE_URL:-}"
  LIBRETRANSLATE_API_KEY: "${LIBRETRANSLATE_API_KEY:-}"

# Synthetic fixture secrets are intentionally API-only. The migration
# container does not need them; the API uses them for the marked fixture
# workspace in this same deployment/database.
x-review-fixture-env: &review-fixture-env
  REVIEW_FIXTURE_PASSWORD: "${REVIEW_FIXTURE_PASSWORD:-}"
  REVIEW_FIXTURE_DELETION_PIN: "${REVIEW_FIXTURE_DELETION_PIN:-}"

x-api-env: &api-env
  <<: [*app-env, *review-fixture-env]

services:
  migrate:
    image: "${IMAGE_REPO:-hackos-api}:${IMAGE_TAG:-latest}"
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/migrate.js"]
    environment: *app-env
    networks: [instance]
    restart: "no"

  api:
    image: "${IMAGE_REPO:-hackos-api}:${IMAGE_TAG:-latest}"
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    # H10/H53: repeat the advisory-locked migration check here as a guard for
    # redeploys that reuse an already-completed one-shot `migrate` container.
    command: ["sh", "-c", "node dist/migrate.js && exec node dist/server.js"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment: *api-env
    # Deterministic external DNS — don't inherit the host's resolv.conf, which
    # can be transiently wrong at deploy time and poison outbound fetches (mail,
    # APNs, Google Wallet). Internal names still resolve via 127.0.0.11.
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [instance, edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: "${API_MEM_LIMIT:-512m}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK:-dokploy-network}"
      - "traefik.http.routers.${STACK_NAME}-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.${STACK_NAME}-api.entrypoints=websecure"
      - "traefik.http.routers.${STACK_NAME}-api.tls=true"
      - "traefik.http.routers.${STACK_NAME}-api.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${STACK_NAME}-api.middlewares=${STACK_NAME}-sec@docker"
      - "traefik.http.services.${STACK_NAME}-api.loadbalancer.server.port=3000"
      # Docker's healthcheck controls container health, but Traefik needs its
      # own readiness check to keep a replica with unavailable Postgres out of ingress.
      - "traefik.http.services.${STACK_NAME}-api.loadbalancer.healthcheck.path=/readyz"
      - "traefik.http.services.${STACK_NAME}-api.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.${STACK_NAME}-api.loadbalancer.healthcheck.timeout=3s"
      # SSE (TV/queue streams) must not be buffered by the proxy.
      - "traefik.http.services.${STACK_NAME}-api.loadbalancer.responseforwarding.flushinterval=-1"
      - "traefik.http.middlewares.${STACK_NAME}-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${STACK_NAME}-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.${STACK_NAME}-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${STACK_NAME}-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.${STACK_NAME}-sec.headers.referrerPolicy=strict-origin-when-cross-origin"

networks:
  instance:
    external: true
    name: "${INSTANCE_NETWORK:-hackos-event2026-net}"
  edge:
    external: true
    name: "${PROXY_NETWORK:-dokploy-network}"
