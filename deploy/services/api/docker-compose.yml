# hackOS · api — one standalone Dokploy service (HTTP API + its migrations).
# Joins the per-instance private network (to reach postgres/valkey/minio) AND
# the proxy network (Traefik ingress). This is the ONLY hackOS service exposed
# to the internet. A one-shot `migrate` runs first, guarded by an advisory lock
# so redeploys/replicas are safe.
#
# Image: set IMAGE_REPO/IMAGE_TAG to a prebuilt image, or let Dokploy build
# from source (build context is the repo root).

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  VALKEY_URL: "redis://:${VALKEY_PASSWORD}@valkey:6379"
  BETTER_AUTH_URL: "https://${API_DOMAIN}"
  BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
  CORS_ORIGINS: "${CORS_ORIGINS:-}"
  TRUST_PROXY: "true"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  S3_ENDPOINT: "http://minio:9000"
  S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
  S3_SECRET_KEY: "${S3_SECRET_KEY}"
  S3_BUCKET: "${S3_BUCKET:-hackos}"
  MAIL_PROVIDER: "${MAIL_PROVIDER:-smtp}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-hackOS}"
  RESEND_API_KEY: "${RESEND_API_KEY:-}"
  POSTAL_URL: "${POSTAL_URL:-}"
  POSTAL_API_KEY: "${POSTAL_API_KEY:-}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"

services:
  migrate:
    image: "${IMAGE_REPO:-hackos-api}:${IMAGE_TAG:-latest}"
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/migrate.js"]
    environment: *app-env
    networks: [instance]
    restart: "no"

  api:
    image: "${IMAGE_REPO:-hackos-api}:${IMAGE_TAG:-latest}"
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/server.js"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [instance, edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: "${API_MEM_LIMIT:-512m}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK:-dokploy-network}"
      - "traefik.http.routers.${STACK_NAME}-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.${STACK_NAME}-api.entrypoints=websecure"
      - "traefik.http.routers.${STACK_NAME}-api.tls=true"
      - "traefik.http.routers.${STACK_NAME}-api.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${STACK_NAME}-api.middlewares=${STACK_NAME}-sec@docker"
      - "traefik.http.services.${STACK_NAME}-api.loadbalancer.server.port=3000"
      # SSE (TV/queue streams) must not be buffered by the proxy.
      - "traefik.http.services.${STACK_NAME}-api.loadbalancer.responseforwarding.flushinterval=-1"
      - "traefik.http.middlewares.${STACK_NAME}-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${STACK_NAME}-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.${STACK_NAME}-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${STACK_NAME}-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.${STACK_NAME}-sec.headers.referrerPolicy=strict-origin-when-cross-origin"

networks:
  instance:
    external: true
    name: "${INSTANCE_NETWORK}"
  edge:
    external: true
    name: "${PROXY_NETWORK:-dokploy-network}"
