# hackOS · web — one standalone Compose service (Next.js frontend).
#
# The web frontend has its own host port and domain (${WEB_DOMAIN}). It is
# never served by, or routed together with, the api service — deploy it
# separately.
#
# Reachability: it publishes port 3001 for an external load balancer or direct
# access. The web tier never touches the datastores, so it does NOT join the
# private instance network.
#
# Add https://${WEB_DOMAIN} to the api's CORS_ORIGINS so credentialed requests
# from the browser are allowed.
#
# The image is environment-neutral. The running server exposes
# /runtime-config.js from the configured domains, so a staging build and its
# later deployment can use the same image digest.

services:
  web:
    image: "${WEB_IMAGE_REPO:-hackos-web}:${IMAGE_TAG:-main}"
    pull_policy: always
    environment:
      API_DOMAIN: "${API_DOMAIN}"
      WEB_DOMAIN: "${WEB_DOMAIN}"
    ports:
      - "${WEB_PORT:-3001}:3001"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [public]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: "${WEB_MEM_LIMIT:-256m}"

networks:
  public:
    driver: bridge
