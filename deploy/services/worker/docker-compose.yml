# hackOS · worker — one standalone Dokploy service (BullMQ background jobs:
# notification dispatch, queue pump, confirmation expirer, scheduled publish).
# No HTTP, no ingress. Joins ONLY the per-instance private network — that
# network is a normal bridge, so the worker still has internet egress for mail
# providers and Expo push. Scale its replicas independently of the API.
#
# DNS: pinned to public resolvers (see the `dns:` key below). Internal service
# names (postgres/valkey/minio) still resolve via Docker's embedded resolver
# (127.0.0.11); only EXTERNAL lookups (Expo exp.host, mail, APNs) use these.
# Without pinning, Docker snapshots the host's /etc/resolv.conf upstreams at
# container-create time — if the host DNS is transiently wrong then (e.g. a
# reboot or Tailscale reconnect mid-deploy), the worker inherits dead upstreams
# and every outbound fetch dies with "fetch failed" until it's recreated (H51).

x-app-env: &app-env
  NODE_ENV: production
  WORKERS_INLINE: "false"
  DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  VALKEY_URL: "redis://:${VALKEY_PASSWORD}@valkey:6379"
  BETTER_AUTH_URL: "https://${API_DOMAIN}"
  BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  # Postgres pool sizing/timeouts (H540) — must match api's values; see
  # docs/env-vars.md's replica-budget math.
  DB_POOL_MAX: "${DB_POOL_MAX:-10}"
  DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-30000}"
  DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-10000}"
  DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-30000}"
  DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}"
  S3_ENDPOINT: "http://minio:9000"
  S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
  S3_SECRET_KEY: "${S3_SECRET_KEY}"
  S3_BUCKET: "${S3_BUCKET:-hackos}"
  S3_PUBLIC_URL: "${S3_PUBLIC_URL:-}"
  MAIL_PROVIDER: "${MAIL_PROVIDER:-smtp}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-hackOS}"
  RESEND_API_KEY: "${RESEND_API_KEY:-}"
  POSTAL_URL: "${POSTAL_URL:-}"
  POSTAL_API_KEY: "${POSTAL_API_KEY:-}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"
  # Wallet passes (H28) — badge rotation pushes/syncs run here. Both
  # optional, see deploy/README.md#wallet-passes-h28.
  APPLE_PASS_TYPE_IDENTIFIER: "${APPLE_PASS_TYPE_IDENTIFIER:-}"
  APPLE_TEAM_IDENTIFIER: "${APPLE_TEAM_IDENTIFIER:-}"
  APPLE_PASS_ORGANIZATION: "${APPLE_PASS_ORGANIZATION:-hackOS}"
  APPLE_PASS_CERTIFICATE_PEM: "${APPLE_PASS_CERTIFICATE_PEM:-}"
  APPLE_PASS_KEY_PEM: "${APPLE_PASS_KEY_PEM:-}"
  APPLE_PASS_KEY_PASSPHRASE: "${APPLE_PASS_KEY_PASSPHRASE:-}"
  APPLE_WWDR_CERTIFICATE_PEM: "${APPLE_WWDR_CERTIFICATE_PEM:-}"
  APPLE_APNS_ENVIRONMENT: "${APPLE_APNS_ENVIRONMENT:-production}"
  APPLE_PASS_APP_STORE_ID: "${APPLE_PASS_APP_STORE_ID:-}"
  GOOGLE_WALLET_ISSUER_ID: "${GOOGLE_WALLET_ISSUER_ID:-}"
  GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL: "${GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL:-}"
  GOOGLE_WALLET_PRIVATE_KEY_PEM: "${GOOGLE_WALLET_PRIVATE_KEY_PEM:-}"

services:
  worker:
    image: "${IMAGE_REPO:-hackos-api}:${IMAGE_TAG:-latest}"
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment: *app-env
    # Deterministic external DNS — do not inherit the host's resolv.conf, which
    # can be transiently wrong at deploy time and poison every outbound fetch.
    dns: ["1.1.1.1", "8.8.8.8"]
    networks: [instance]
    # The image bakes an HTTP /healthz probe for the API; the worker serves no
    # HTTP, so disable it. Liveness is process-based: on crash, restart kicks in.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: "${WORKER_MEM_LIMIT:-512m}"

networks:
  instance:
    external: true
    name: "${INSTANCE_NETWORK:-hackos-event2026-net}"
