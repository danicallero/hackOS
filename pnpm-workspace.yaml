packages:
  - apps/*
  - packages/*

# pnpm 11 errors when a dependency's build script is ignored. esbuild (used by
# tsup) needs to install its platform binary; the rest are optional native
# accelerators we intentionally skip. Without this, `pnpm install
# --frozen-lockfile` in the Docker build fails with ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - msgpackr-extract

# The team develops on both macOS and Linux; keep both platforms' optional
# binaries resolvable in the lockfile so either OS can install from it.
# pnpm 10 moved these out of package.json's "pnpm" field into this file -
# leaving them in package.json makes pnpm silently ignore them.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64

patchedDependencies:
  '@expo/cli': patches/@expo__cli.patch
