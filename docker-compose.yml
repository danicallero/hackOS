# Local dev infrastructure for hackOS (plan/01: Postgres + Valkey + MinIO; mail via Mailpit).
# The API itself runs on the host during development (`pnpm dev`); apps/api/Dockerfile
# exists for deployment builds and is wired here under the `full` profile.
name: hackos

services:
  postgres:
    image: postgres:17-alpine
    ports:
      # 5433 on the host: many dev machines already run a local postgres on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: hackos
      POSTGRES_PASSWORD: hackos
      POSTGRES_DB: hackos
    volumes:
      - pgdata17:/var/lib/postgresql/data
      # Test database, recreated at will by the test harness
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackos"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: hackos
      MINIO_ROOT_PASSWORD: hackos-secret
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://hackos:hackos@postgres:5432/hackos
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: hackos
      S3_SECRET_KEY: hackos-secret
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: dev-only-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  pgdata17:
  miniodata:
