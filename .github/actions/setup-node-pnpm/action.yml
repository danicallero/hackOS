name: Set up Node.js workspace
description: Install the repository-pinned Node.js, pnpm, and workspace dependencies.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.19.0

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: |
        CI_PROGRESS_LABEL="Install dependencies" CI_PROGRESS_REMAINING="return to calling workflow" \
          bash scripts/ci-progress.sh <(echo "pnpm install --frozen-lockfile")
