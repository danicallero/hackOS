name: CD

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: hackos-${{ github.ref_name }}-release
  cancel-in-progress: false

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.filter.outputs.api_image }}
      web_image: ${{ steps.filter.outputs.web_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          event_name: ${{ github.event_name }}
          before_sha: ${{ github.event.before }}
          sha: ${{ github.sha }}

  publish-api:
    name: Publish API image (arm64)
    needs: changes
    if: >-
      needs.changes.outputs.api_image == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hackos-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hackos-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hackos-api-arm64
          cache-to: type=gha,mode=max,scope=hackos-api-arm64

  publish-web:
    name: Publish web image (arm64)
    needs: changes
    if: >-
      needs.changes.outputs.web_image == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hackos-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hackos-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hackos-web-arm64
          cache-to: type=gha,mode=max,scope=hackos-web-arm64
