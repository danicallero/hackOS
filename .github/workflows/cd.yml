name: CD

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: hackos-${{ github.ref_name }}-release
  cancel-in-progress: false

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.filter.outputs.api_image }}
      web_image: ${{ steps.filter.outputs.web_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          event_name: ${{ github.event_name }}
          before_sha: ${{ github.event.before }}
          sha: ${{ github.sha }}

  release-source:
    name: resolve release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      source_branch: ${{ steps.resolve.outputs.source_branch }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve build or promotion path
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" == "staging" ]]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "source_branch=staging" >> "$GITHUB_OUTPUT"
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          staging_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/staging" --jq '.object.sha')"
          integration_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/integration" --jq '.object.sha')"
          git fetch --no-tags origin \
            "refs/heads/staging:refs/remotes/origin/staging" \
            "refs/heads/integration:refs/remotes/origin/integration"

          if [[ "$(git rev-parse HEAD^{tree})" == "$(git rev-parse origin/staging^{tree})" ]]; then
            echo "mode=promote" >> "$GITHUB_OUTPUT"
            echo "source_branch=staging" >> "$GITHUB_OUTPUT"
            echo "source_sha=$staging_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$(git rev-parse HEAD^{tree})" == "$(git rev-parse origin/integration^{tree})" ]]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "source_branch=integration" >> "$GITHUB_OUTPUT"
            echo "source_sha=$integration_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "The main commit must match the tree of staging or integration; promote main through one of those branches." >&2
          exit 1

  publish-api:
    name: Publish API image (arm64)
    needs: [changes, release-source]
    if: >-
      needs.changes.outputs.api_image == 'true' &&
      needs.release-source.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Staging builds for verification. Main builds only for the fast
      # integration -> main path; a staging -> main promotion reuses the
      # immutable staging digest instead.
      - name: Build and publish API release image
        if: github.ref_name == 'staging' || needs.release-source.outputs.mode == 'build'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hackos-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hackos-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hackos-api-arm64
          cache-to: type=gha,mode=max,scope=hackos-api-arm64

      - name: Resolve staging API image
        if: github.ref_name == 'main' && needs.release-source.outputs.mode == 'promote'
        env:
          SOURCE_BRANCH: ${{ needs.release-source.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.release-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/hackos-api:sha-${SOURCE_SHA}"
          docker buildx imagetools inspect "$source_image"
          echo "Promoting the $SOURCE_BRANCH release image ($SOURCE_SHA)."
          echo "SOURCE_IMAGE=$source_image" >> "$GITHUB_ENV"

      - name: Promote staging API image to production tags
        if: github.ref_name == 'main' && needs.release-source.outputs.mode == 'promote'
        env:
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/hackos-api:main
          TARGET_SHA_IMAGE: ghcr.io/${{ github.repository_owner }}/hackos-api:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$SOURCE_IMAGE"
          docker buildx imagetools create \
            --tag "$TARGET_IMAGE" \
            --tag "$TARGET_SHA_IMAGE" \
            "$SOURCE_IMAGE"

  publish-web:
    name: Publish web image (arm64)
    needs: [changes, release-source]
    if: >-
      needs.changes.outputs.web_image == 'true' &&
      needs.release-source.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web release image
        if: github.ref_name == 'staging' || needs.release-source.outputs.mode == 'build'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hackos-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hackos-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hackos-web-arm64
          cache-to: type=gha,mode=max,scope=hackos-web-arm64

      - name: Resolve staging web image
        if: github.ref_name == 'main' && needs.release-source.outputs.mode == 'promote'
        env:
          SOURCE_BRANCH: ${{ needs.release-source.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.release-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/hackos-web:sha-${SOURCE_SHA}"
          docker buildx imagetools inspect "$source_image"
          echo "Promoting the $SOURCE_BRANCH release image ($SOURCE_SHA)."
          echo "SOURCE_IMAGE=$source_image" >> "$GITHUB_ENV"

      - name: Promote staging web image to production tags
        if: github.ref_name == 'main' && needs.release-source.outputs.mode == 'promote'
        env:
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/hackos-web:main
          TARGET_SHA_IMAGE: ghcr.io/${{ github.repository_owner }}/hackos-web:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$SOURCE_IMAGE"
          docker buildx imagetools create \
            --tag "$TARGET_IMAGE" \
            --tag "$TARGET_SHA_IMAGE" \
            "$SOURCE_IMAGE"

  deploy-dokploy:
    name: Deploy changed services to Dokploy
    needs: [publish-api, publish-web, release-source]
    if: >-
      always() &&
      (github.ref_name == 'staging' || github.ref_name == 'main') &&
      needs.release-source.result == 'success' &&
      (needs.publish-api.result == 'success' || needs.publish-web.result == 'success')
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Dokploy deployment configuration
        id: deployment-config
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          DOKPLOY_STAGING_API_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_STAGING_API_DEPLOY_WEBHOOK }}
          DOKPLOY_STAGING_WORKER_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_STAGING_WORKER_DEPLOY_WEBHOOK }}
          DOKPLOY_STAGING_WEB_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_STAGING_WEB_DEPLOY_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=()
          for variable in \
            TS_OAUTH_CLIENT_ID \
            TS_AUDIENCE \
            DOKPLOY_STAGING_API_DEPLOY_WEBHOOK \
            DOKPLOY_STAGING_WORKER_DEPLOY_WEBHOOK \
            DOKPLOY_STAGING_WEB_DEPLOY_WEBHOOK; do
            if [[ -z "${!variable}" ]]; then
              missing+=("$variable")
            fi
          done

          if ((${#missing[@]} > 0)); then
            echo "Staging Dokploy is not configured; skipping deployment. Missing: ${missing[*]}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Connect to the tailnet
        if: steps.deployment-config.outputs.enabled == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: danipi.hamster-cat.ts.net

      - name: Trigger API and worker deployments
        if: >-
          steps.deployment-config.outputs.enabled == 'true' &&
          needs.publish-api.result == 'success'
        env:
          DOKPLOY_API_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_API_DEPLOY_WEBHOOK }}
          DOKPLOY_WORKER_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WORKER_DEPLOY_WEBHOOK }}
          DOKPLOY_STAGING_API_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_STAGING_API_DEPLOY_WEBHOOK }}
          DOKPLOY_STAGING_WORKER_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_STAGING_WORKER_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail

          api_webhook="$DOKPLOY_API_DEPLOY_WEBHOOK"
          worker_webhook="$DOKPLOY_WORKER_DEPLOY_WEBHOOK"
          if [[ "$GITHUB_REF_NAME" == "staging" ]]; then
            api_webhook="$DOKPLOY_STAGING_API_DEPLOY_WEBHOOK"
            worker_webhook="$DOKPLOY_STAGING_WORKER_DEPLOY_WEBHOOK"
          fi

          post_webhook() {
            local service="$1"
            local webhook="$2"
            local response

            if [[ -z "$webhook" ]]; then
              echo "Missing Dokploy webhook for $service." >&2
              return 1
            fi

            if ! response="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              --header 'Content-Type: application/json' \
              --header 'X-GitHub-Event: push' \
              --data-binary "@$GITHUB_EVENT_PATH" \
              --request POST "$webhook")"; then
              echo "Dokploy webhook request failed for $service." >&2
              return 1
            fi

            printf '%s\n' "$response"
            if grep -Fq 'Branch Not Match' <<<"$response"; then
              echo "Dokploy rejected the $service deployment because the branch did not match." >&2
              return 1
            fi
          }

          failures=0
          post_webhook api "$api_webhook" || failures=1
          post_webhook worker "$worker_webhook" || failures=1
          exit "$failures"

      - name: Trigger web deployment
        if: >-
          steps.deployment-config.outputs.enabled == 'true' &&
          needs.publish-web.result == 'success'
        env:
          DOKPLOY_WEB_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEB_DEPLOY_WEBHOOK }}
          DOKPLOY_STAGING_WEB_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_STAGING_WEB_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail
          web_webhook="$DOKPLOY_WEB_DEPLOY_WEBHOOK"
          if [[ "$GITHUB_REF_NAME" == "staging" ]]; then
            web_webhook="$DOKPLOY_STAGING_WEB_DEPLOY_WEBHOOK"
          fi

          if [[ -z "$web_webhook" ]]; then
            echo "Missing Dokploy webhook for web." >&2
            exit 1
          fi

          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --data-binary "@$GITHUB_EVENT_PATH" \
            --request POST "$web_webhook")"
          printf '%s\n' "$response"
          if grep -Fq 'Branch Not Match' <<<"$response"; then
            echo "Dokploy rejected the web deployment because the branch did not match." >&2
            exit 1
          fi
