name: CD

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: hackos-${{ github.ref_name }}-release
  cancel-in-progress: false

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.filter.outputs.api_image }}
      web_image: ${{ steps.filter.outputs.web_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          event_name: ${{ github.event_name }}
          before_sha: ${{ github.event.before }}
          sha: ${{ github.sha }}

  publish-api:
    name: Publish API image (arm64)
    needs: changes
    if: needs.changes.outputs.api_image == 'true'
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The batch is built only after it lands on staging. API and worker
      # deliberately consume this one image. Main promotes the immutable staged
      # digest instead of rebuilding it.
      - name: Build and publish staging API image
        if: github.ref_name == 'staging'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hackos-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hackos-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hackos-api-arm64
          cache-to: type=gha,mode=max,scope=hackos-api-arm64

      - name: Resolve staged API image
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          staging_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/staging" --jq '.object.sha')"
          git fetch --no-tags origin "refs/heads/staging:refs/remotes/origin/staging"
          if [[ "$(git rev-parse HEAD^{tree})" != "$(git rev-parse origin/staging^{tree})" ]]; then
            echo "The main commit is not the same source tree as staging; promote staging through a PR." >&2
            exit 1
          fi
          echo "SOURCE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER}/hackos-api:sha-${staging_sha}" >> "$GITHUB_ENV"

      - name: Promote staged API image to production tags
        if: github.ref_name == 'main'
        env:
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/hackos-api:main
          TARGET_SHA_IMAGE: ghcr.io/${{ github.repository_owner }}/hackos-api:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$SOURCE_IMAGE"
          docker buildx imagetools create \
            --tag "$TARGET_IMAGE" \
            --tag "$TARGET_SHA_IMAGE" \
            "$SOURCE_IMAGE"

  publish-web:
    name: Publish web image (arm64)
    needs: changes
    if: needs.changes.outputs.web_image == 'true'
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish staging web image
        if: github.ref_name == 'staging'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hackos-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hackos-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hackos-web-arm64
          cache-to: type=gha,mode=max,scope=hackos-web-arm64

      - name: Resolve staged web image
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          staging_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/staging" --jq '.object.sha')"
          git fetch --no-tags origin "refs/heads/staging:refs/remotes/origin/staging"
          if [[ "$(git rev-parse HEAD^{tree})" != "$(git rev-parse origin/staging^{tree})" ]]; then
            echo "The main commit is not the same source tree as staging; promote staging through a PR." >&2
            exit 1
          fi
          echo "SOURCE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER}/hackos-web:sha-${staging_sha}" >> "$GITHUB_ENV"

      - name: Promote staged web image to production tags
        if: github.ref_name == 'main'
        env:
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/hackos-web:main
          TARGET_SHA_IMAGE: ghcr.io/${{ github.repository_owner }}/hackos-web:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$SOURCE_IMAGE"
          docker buildx imagetools create \
            --tag "$TARGET_IMAGE" \
            --tag "$TARGET_SHA_IMAGE" \
            "$SOURCE_IMAGE"

  deploy-dokploy:
    name: Deploy changed services to Dokploy
    needs: [publish-api, publish-web]
    if: >-
      always() &&
      (needs.publish-api.result == 'success' || needs.publish-web.result == 'success')
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Connect to the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: danipi.hamster-cat.ts.net

      - name: Trigger API and worker deployments
        if: needs.publish-api.result == 'success'
        env:
          DOKPLOY_API_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_API_DEPLOY_WEBHOOK }}
          DOKPLOY_WORKER_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WORKER_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail

          post_webhook() {
            local service="$1"
            local webhook="$2"
            local response

            if [[ -z "$webhook" ]]; then
              echo "Missing Dokploy webhook for $service." >&2
              return 1
            fi

            if ! response="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              --header 'Content-Type: application/json' \
              --header 'X-GitHub-Event: push' \
              --data-binary "@$GITHUB_EVENT_PATH" \
              --request POST "$webhook")"; then
              echo "Dokploy webhook request failed for $service." >&2
              return 1
            fi

            printf '%s\n' "$response"
            if grep -Fq 'Branch Not Match' <<<"$response"; then
              echo "Dokploy rejected the $service deployment because the branch did not match." >&2
              return 1
            fi
          }

          failures=0
          post_webhook api "$DOKPLOY_API_DEPLOY_WEBHOOK" || failures=1
          post_webhook worker "$DOKPLOY_WORKER_DEPLOY_WEBHOOK" || failures=1
          exit "$failures"

      - name: Trigger web deployment
        if: always() && needs.publish-web.result == 'success'
        env:
          DOKPLOY_WEB_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEB_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail
          if [[ -z "$DOKPLOY_WEB_DEPLOY_WEBHOOK" ]]; then
            echo "Missing Dokploy webhook for web." >&2
            exit 1
          fi

          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --data-binary "@$GITHUB_EVENT_PATH" \
            --request POST "$DOKPLOY_WEB_DEPLOY_WEBHOOK")"
          printf '%s\n' "$response"
          if grep -Fq 'Branch Not Match' <<<"$response"; then
            echo "Dokploy rejected the web deployment because the branch did not match." >&2
            exit 1
          fi
