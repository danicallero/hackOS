name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Run lint
        run: pnpm lint

      - name: Test deployment script release-tag handling
        run: bash deploy/test-services-image-tags.sh

      - name: Validate deployment shell syntax
        run: bash deploy/test-shell-syntax.sh

      - name: Validate combined production environment contract
        run: bash deploy/test-combined-env.sh

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Type-check every workspace
        run: pnpm --parallel --filter @hackos/api --filter @hackos/web --filter @hackos/mobile typecheck

  api-test:
    name: API integration tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://hackos:hackos@localhost:5432/hackos_test
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: hackos
      S3_SECRET_KEY: hackos-secret
      S3_BUCKET: hackos
      S3_REGION: us-east-1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hackos
          POSTGRES_PASSWORD: hackos
          POSTGRES_DB: hackos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackos -d hackos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Start LocalStack S3
        run: |
          docker run --detach --name hackos-ci-localstack \
            --publish 9000:4566 \
            --env SERVICES=s3 \
            --env EAGER_SERVICE_LOADING=1 \
            --env AWS_DEFAULT_REGION=us-east-1 \
            localstack/localstack:latest

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Wait for LocalStack S3
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:9000/_localstack/health \
              | grep -q '"s3": "available"'; then
                exit 0
            fi
            sleep 1
          done
          docker logs hackos-ci-localstack
          exit 1

      - name: Create S3 test bucket
        run: >-
          docker run --rm --network host
          -e AWS_ACCESS_KEY_ID=hackos
          -e AWS_SECRET_ACCESS_KEY=hackos-secret
          -e AWS_DEFAULT_REGION=us-east-1
          amazon/aws-cli:latest
          --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket hackos

      - name: Run API integration tests
        run: pnpm --filter @hackos/api test

      - name: Stop LocalStack
        if: always()
        run: docker rm --force hackos-ci-localstack || true

  web-test:
    name: web unit tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Run web unit tests
        run: pnpm --filter @hackos/web test

  browser-smoke:
    name: browser critical-flow smoke
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run deterministic browser smoke
        run: pnpm test:ui:browser --project=chromium

  mobile-test:
    name: mobile unit tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Run mobile unit tests
        run: pnpm --filter @hackos/mobile test
