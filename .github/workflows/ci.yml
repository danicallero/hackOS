name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          changed_files="$RUNNER_TEMP/hackos-changed-files.txt"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$SHA" > "$changed_files"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --root --no-commit-id --name-only -r "$SHA" > "$changed_files"
          else
            git diff --name-only "$BEFORE_SHA" "$SHA" > "$changed_files"
          fi

          echo "Changed paths:"
          sed -n '1,120p' "$changed_files"

          has_change() {
            grep -Eq "$1" "$changed_files"
          }

          api=false
          web=false
          mobile=false

          # Shared packages, dependency/toolchain changes, and workflow changes
          # can affect every workspace and therefore run every quality gate.
          if has_change '^(packages/|\.github/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.node-version$|biome\.json$|tsconfig[^/]*\.json$)'; then
            api=true
            web=true
            mobile=true
          fi

          if has_change '^(apps/api/|docker-compose\.yml$)'; then
            api=true
          fi

          if has_change '^apps/web/'; then
            web=true
          fi

          if has_change '^(apps/mobile/|e2e/mobile/)'; then
            mobile=true
          fi

          typecheck=false
          if [[ "$api" == true || "$web" == true || "$mobile" == true ]]; then
            typecheck=true
          fi

          {
            echo "api=$api"
            echo "web=$web"
            echo "mobile=$mobile"
            echo "typecheck=$typecheck"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check API
        if: needs.changes.outputs.api == 'true'
        run: pnpm --filter @hackos/api typecheck

      - name: Type-check web
        if: needs.changes.outputs.web == 'true'
        run: pnpm --filter @hackos/web typecheck

      - name: Type-check mobile
        if: needs.changes.outputs.mobile == 'true'
        run: pnpm --filter @hackos/mobile typecheck

  api-test:
    name: API integration tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://hackos:hackos@localhost:5432/hackos_test
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: hackos
      S3_SECRET_KEY: hackos-secret
      S3_BUCKET: hackos
      S3_REGION: us-east-1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hackos
          POSTGRES_PASSWORD: hackos
          POSTGRES_DB: hackos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackos -d hackos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MinIO
        run: |
          docker run --detach --name hackos-ci-minio \
            --publish 9000:9000 \
            --publish 9001:9001 \
            --env MINIO_ROOT_USER=hackos \
            --env MINIO_ROOT_PASSWORD=hackos-secret \
            --health-cmd "mc ready local" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 12 \
            minio/minio:latest \
            server /data --console-address ":9001"

      - name: Wait for MinIO
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' hackos-ci-minio)"
            case "$status" in
              healthy)
                exit 0
                ;;
              unhealthy)
                docker logs hackos-ci-minio
                exit 1
                ;;
            esac
            sleep 1
          done
          docker logs hackos-ci-minio
          exit 1

      - name: Create MinIO test bucket
        run: >-
          docker run --rm --network host --entrypoint /bin/sh
          -e MINIO_ROOT_USER=hackos
          -e MINIO_ROOT_PASSWORD=hackos-secret
          minio/mc:latest
          -c 'mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/hackos'

      - name: Run API integration tests
        run: pnpm --filter @hackos/api test

      - name: Stop MinIO
        if: always()
        run: docker rm --force hackos-ci-minio || true

  web-test:
    name: web unit tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web unit tests
        run: pnpm --filter @hackos/web test

  mobile-test:
    name: mobile unit tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mobile unit tests
        run: pnpm --filter @hackos/mobile test
