name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-source:
    name: release source
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require a protected release branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$HEAD_BRANCH" in
            implementation|integration|staging)
              if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
                echo "Main promotions must come from a release branch in $REPOSITORY." >&2
                exit 1
              fi
              ;;
            *)
              echo "Main promotions must come from implementation, integration, or staging; got $HEAD_BRANCH." >&2
              exit 1
              ;;
          esac

  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      browser: ${{ steps.filter.outputs.browser }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          event_name: ${{ github.event_name }}
          before_sha: ${{ github.event.before }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          sha: ${{ github.sha }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: typecheck
    needs: changes
    if: >-
      github.event.pull_request.draft != true &&
      needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Type-check API
        if: needs.changes.outputs.api == 'true'
        run: pnpm --filter @hackos/api typecheck

      - name: Type-check web
        if: needs.changes.outputs.web == 'true'
        run: pnpm --filter @hackos/web typecheck

      - name: Type-check mobile
        if: needs.changes.outputs.mobile == 'true'
        run: pnpm --filter @hackos/mobile typecheck

  api-test:
    name: API integration tests
    needs: changes
    if: >-
      github.event.pull_request.draft != true &&
      needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://hackos:hackos@localhost:5432/hackos_test
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: hackos
      S3_SECRET_KEY: hackos-secret
      S3_BUCKET: hackos
      S3_REGION: us-east-1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hackos
          POSTGRES_PASSWORD: hackos
          POSTGRES_DB: hackos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackos -d hackos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Start MinIO
        run: |
          docker run --detach --name hackos-ci-minio \
            --publish 9000:9000 \
            --publish 9001:9001 \
            --env MINIO_ROOT_USER=hackos \
            --env MINIO_ROOT_PASSWORD=hackos-secret \
            --health-cmd "mc ready local" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 12 \
            quay.io/minio/minio:latest \
            server /data --console-address ":9001"

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Wait for MinIO
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' hackos-ci-minio)"
            case "$status" in
              healthy)
                exit 0
                ;;
              unhealthy)
                docker logs hackos-ci-minio
                exit 1
                ;;
            esac
            sleep 1
          done
          docker logs hackos-ci-minio
          exit 1

      - name: Create MinIO test bucket
        run: >-
          docker run --rm --network host --entrypoint /bin/sh
          -e MINIO_ROOT_USER=hackos
          -e MINIO_ROOT_PASSWORD=hackos-secret
          quay.io/minio/mc:latest
          -c 'mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/hackos'

      - name: Run API integration tests
        run: pnpm --filter @hackos/api test

      - name: Stop MinIO
        if: always()
        run: docker rm --force hackos-ci-minio || true

  web-test:
    name: web unit tests
    needs: changes
    if: >-
      github.event.pull_request.draft != true &&
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Run web unit tests
        run: pnpm --filter @hackos/web test

  browser-smoke:
    name: browser critical-flow smoke
    needs: changes
    if: >-
      github.event.pull_request.draft != true &&
      needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run deterministic browser smoke
        run: pnpm test:ui:browser --project=chromium

  mobile-test:
    name: mobile unit tests
    needs: changes
    if: >-
      github.event.pull_request.draft != true &&
      needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Run mobile unit tests
        run: pnpm --filter @hackos/mobile test
