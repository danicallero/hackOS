name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash scripts/ci-progress.sh {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Run lint
        env:
          CI_PROGRESS_LABEL: "Run lint"
          CI_PROGRESS_REMAINING: "Run shared contract tests -> Test memory collector -> Test deployment script release-tag handling -> Validate deployment shell syntax -> Validate combined production environment contract -> Test deployment rollback and failed-migration handling"
        run: pnpm lint

      - name: Run shared contract tests
        env:
          CI_PROGRESS_LABEL: "Run shared contract tests"
          CI_PROGRESS_REMAINING: "Test memory collector -> Test deployment script release-tag handling -> Validate deployment shell syntax -> Validate combined production environment contract -> Test deployment rollback and failed-migration handling"
        run: pnpm --filter @hackos/shared test

      - name: Test memory collector
        env:
          CI_PROGRESS_LABEL: "Test memory collector"
          CI_PROGRESS_REMAINING: "Test deployment script release-tag handling -> Validate deployment shell syntax -> Validate combined production environment contract -> Test deployment rollback and failed-migration handling"
        run: go test deploy/metrics/main.go deploy/metrics/main_test.go

      - name: Test deployment script release-tag handling
        env:
          CI_PROGRESS_LABEL: "Test deployment script release-tag handling"
          CI_PROGRESS_REMAINING: "Validate deployment shell syntax -> Validate combined production environment contract -> Test deployment rollback and failed-migration handling"
        run: bash deploy/test-services-image-tags.sh

      - name: Validate deployment shell syntax
        env:
          CI_PROGRESS_LABEL: "Validate deployment shell syntax"
          CI_PROGRESS_REMAINING: "Validate combined production environment contract -> Test deployment rollback and failed-migration handling"
        run: bash deploy/test-shell-syntax.sh

      - name: Validate combined production environment contract
        env:
          CI_PROGRESS_LABEL: "Validate combined production environment contract"
          CI_PROGRESS_REMAINING: "Test deployment rollback and failed-migration handling"
        run: bash deploy/test-combined-env.sh

      - name: Test deployment rollback and failed-migration handling
        env:
          CI_PROGRESS_LABEL: "Test deployment rollback and failed-migration handling"
          CI_PROGRESS_REMAINING: "job cleanup"
        run: bash deploy/test-deploy-rollback.sh

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Type-check every workspace
        env:
          CI_PROGRESS_LABEL: "Type-check every workspace"
          CI_PROGRESS_REMAINING: "job cleanup"
        run: pnpm --parallel --filter @hackos/api --filter @hackos/web --filter @hackos/mobile typecheck

  api-test:
    name: API integration tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://hackos:hackos@localhost:5432/hackos_test
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: hackos
      S3_SECRET_KEY: hackos-secret
      S3_BUCKET: hackos
      S3_REGION: us-east-1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hackos
          POSTGRES_PASSWORD: hackos
          POSTGRES_DB: hackos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackos -d hackos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start S3Mock
        env:
          CI_PROGRESS_LABEL: "Start S3Mock"
          CI_PROGRESS_REMAINING: "Set up workspace -> Wait for S3Mock -> Run API integration tests -> Check the migration upgrade path from the base branch -> Stop S3Mock"
        run: |
          docker run --detach --name hackos-ci-s3mock \
            --publish 9000:9090 \
            adobe/s3mock:latest

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Wait for S3Mock
        env:
          CI_PROGRESS_LABEL: "Wait for S3Mock"
          CI_PROGRESS_REMAINING: "Run API integration tests -> Check the migration upgrade path from the base branch -> Stop S3Mock"
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:9000/favicon.ico; then
              exit 0
            fi
            sleep 1
          done
          docker logs hackos-ci-s3mock
          exit 1

      - name: Run API integration tests
        env:
          CI_PROGRESS_LABEL: "Run API integration tests"
          CI_PROGRESS_REMAINING: "Check the migration upgrade path from the base branch -> Stop S3Mock"
        run: pnpm --filter @hackos/api test

      # #1276: a database already at the base branch's migrations must upgrade to
      # this PR's set with the built `node dist/migrate.js` (the command the
      # deploy runs). Fresh-database tests cannot see ordering conflicts such as
      # a lower-numbered migration landing after a higher one was applied.
      - name: Check the migration upgrade path from the base branch
        env:
          CI_PROGRESS_LABEL: "Check the migration upgrade path from the base branch"
          CI_PROGRESS_REMAINING: "Stop S3Mock"
          BASE_REF: ${{ github.base_ref }}
          PGPASSWORD: hackos
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          mkdir -p "$RUNNER_TEMP/base"
          git archive FETCH_HEAD apps/api/db/migrations | tar -x -C "$RUNNER_TEMP/base"
          psql -h localhost -U hackos -d hackos_test -c 'CREATE DATABASE hackos_upgrade'
          export DATABASE_URL=postgres://hackos:hackos@localhost:5432/hackos_upgrade
          pnpm --filter @hackos/api exec tsup
          cd apps/api
          HACKOS_MIGRATIONS_DIR="$RUNNER_TEMP/base/apps/api/db/migrations" node dist/migrate.js
          node dist/migrate.js
          expected="$(ls db/migrations/*.sql | wc -l)"
          applied="$(psql -h localhost -U hackos -d hackos_upgrade -Atc 'SELECT count(*) FROM _migrations')"
          test "$applied" -ge "$expected" || { echo "ledger has $applied of $expected migrations"; exit 1; }

      - name: Stop S3Mock
        env:
          CI_PROGRESS_LABEL: "Stop S3Mock"
          CI_PROGRESS_REMAINING: "job cleanup"
        if: always()
        run: docker rm --force hackos-ci-s3mock || true

  web-test:
    name: web unit tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Run web unit tests
        env:
          CI_PROGRESS_LABEL: "Run web unit tests"
          CI_PROGRESS_REMAINING: "job cleanup"
        run: pnpm --filter @hackos/web test --reporter=verbose

  browser-smoke:
    name: browser smoke shard ${{ matrix.shard }}/3
    timeout-minutes: 30
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: true
      E2E_WORKERS: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Chromium
        env:
          CI_PROGRESS_LABEL: "Install Chromium"
          CI_PROGRESS_REMAINING: "Run deterministic browser smoke -> Upload browser diagnostics"
        timeout-minutes: 12
        # The runner's Ubuntu mirror sometimes fails to resolve and apt then hangs for
        # minutes. Bound each attempt, and fall back to the browser download alone:
        # the runner image already ships most of the system libraries.
        run: |
          for attempt in 1 2; do
            timeout 240 pnpm exec playwright install --with-deps chromium && exit 0
            echo "Chromium install with system packages failed (attempt $attempt)"
          done
          pnpm exec playwright install chromium

      - name: Run deterministic browser smoke
        env:
          CI_PROGRESS_LABEL: "Run deterministic browser smoke"
          CI_PROGRESS_REMAINING: "Upload browser diagnostics"
        run: |
          echo "Browser phase: start Next.js, execute Chromium tests, then upload diagnostics."
          echo "Runner CPU count: $(nproc)"
          free -m
          pnpm test:ui:browser --project=chromium --shard=${{ matrix.shard }}/3

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            artifacts/browser-results.json
            artifacts/playwright/
          if-no-files-found: ignore
          retention-days: 7

  browser-smoke-summary:
    name: browser critical-flow smoke
    needs: browser-smoke
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard to pass
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.browser-smoke.result }}
        run: |
          echo "All browser shards finished: $SHARD_RESULT; remaining: job cleanup"
          test "$SHARD_RESULT" = success

  mobile-test:
    name: mobile unit tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Run mobile unit tests
        env:
          CI_PROGRESS_LABEL: "Run mobile unit tests"
          CI_PROGRESS_REMAINING: "job cleanup"
        run: pnpm --filter @hackos/mobile exec jest --maxWorkers=2 --verbose

  container-test:
    name: memory collector container runtime
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify real cgroup limits and collector privileges
        env:
          CI_PROGRESS_LABEL: "Verify real cgroup limits and collector privileges"
          CI_PROGRESS_REMAINING: "job cleanup"
        run: bash deploy/metrics/test-runtime.sh
