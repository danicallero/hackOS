name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Run lint
        run: pnpm lint

      - name: Test deployment script release-tag handling
        run: bash deploy/test-services-image-tags.sh

      - name: Validate deployment shell syntax
        run: bash deploy/test-shell-syntax.sh

      - name: Validate combined production environment contract
        run: bash deploy/test-combined-env.sh

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Type-check every workspace
        run: pnpm --parallel --filter @hackos/api --filter @hackos/web --filter @hackos/mobile typecheck

  api-test:
    name: API integration tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://hackos:hackos@localhost:5432/hackos_test
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: hackos
      S3_SECRET_KEY: hackos-secret
      S3_BUCKET: hackos
      S3_REGION: us-east-1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hackos
          POSTGRES_PASSWORD: hackos
          POSTGRES_DB: hackos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackos -d hackos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Start MinIO
        run: |
          docker run --detach --name hackos-ci-minio \
            --publish 9000:9000 \
            --publish 9001:9001 \
            --env MINIO_ROOT_USER=hackos \
            --env MINIO_ROOT_PASSWORD=hackos-secret \
            --health-cmd "mc ready local" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 12 \
            minio/minio:latest \
            server /data --console-address ":9001"

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Wait for MinIO
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' hackos-ci-minio)"
            case "$status" in
              healthy)
                exit 0
                ;;
              unhealthy)
                docker logs hackos-ci-minio
                exit 1
                ;;
            esac
            sleep 1
          done
          docker logs hackos-ci-minio
          exit 1

      - name: Create MinIO test bucket
        run: >-
          docker run --rm --network host --entrypoint /bin/sh
          -e MINIO_ROOT_USER=hackos
          -e MINIO_ROOT_PASSWORD=hackos-secret
          minio/mc:latest
          -c 'mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/hackos'

      - name: Run API integration tests
        run: pnpm --filter @hackos/api test

      - name: Stop MinIO
        if: always()
        run: docker rm --force hackos-ci-minio || true

  web-test:
    name: web unit tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Run web unit tests
        run: pnpm --filter @hackos/web test

  browser-smoke:
    name: browser critical-flow smoke
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run deterministic browser smoke
        run: pnpm test:ui:browser --project=chromium

  mobile-test:
    name: mobile unit tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Run mobile unit tests
        run: pnpm --filter @hackos/mobile test
