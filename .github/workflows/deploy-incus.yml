name: Deploy with Incus

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Actions environment and hackos stack to deploy
        required: true
        type: choice
        options:
          - production
          - staging
      tag:
        description: Immutable GHCR tag, for example sha-<40 lowercase hex characters>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hackos-incus-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy hackOS with Incus
    runs-on: self-hosted
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate deployment inputs
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          case "$DEPLOY_ENVIRONMENT" in
            production|staging) ;;
            *)
              echo "Invalid deployment environment." >&2
              exit 1
              ;;
          esac

          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "The deployment tag must match sha-<40 lowercase hex characters>." >&2
            exit 1
          fi

          echo "Deployment inputs: environment=$DEPLOY_ENVIRONMENT tag=$IMAGE_TAG"

      - name: Check Incus access
        shell: bash
        run: |
          set -euo pipefail
          command -v incus >/dev/null
          incus info hackos >/dev/null
          echo "Incus instance hackos is reachable."

      - name: Transfer deployment files to hackos LXC
        shell: bash
        run: |
          set -euo pipefail
          incus exec hackos -- mkdir -p /root/hackos
          incus file push deploy/docker-compose.yml hackos/root/hackos/docker-compose.yml
          incus file push deploy/incus-deploy.sh hackos/root/hackos/deploy.sh
          incus file push deploy/scripts/check-env.sh hackos/root/hackos/check-env.sh
          incus exec hackos -- chmod 700 /root/hackos/deploy.sh /root/hackos/check-env.sh
          echo "Compose, validation and deployment scripts transferred."

      - name: Deploy inside hackos LXC
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          incus exec hackos -- /root/hackos/deploy.sh "$DEPLOY_ENVIRONMENT" "$IMAGE_TAG"
